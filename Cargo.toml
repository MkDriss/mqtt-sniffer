[package]
name = "mqtt-sniffer"
version = "1.0.0"
edition = "2024"
# Version minimale de Rust : `slice::as_chunks` (src/checksum.rs) date de Rust 1.88.
rust-version = "1.88"
description = "Sniffer défensif pédagogique : capture -> Ethernet/IP/TCP -> MQTT"
license = "MIT OR Apache-2.0"

[dependencies]
# Binding Rust de libpcap (le moteur de capture de tcpdump/Wireshark).
# Doc : https://docs.rs/pcap
pcap = "2"

# Parsing des arguments CLI, même choix que pour le scanner de ports.
clap = { version = "4", features = ["derive"] }

# Découpage zéro-copie des en-têtes Ethernet / IP / TCP.
# Doc : https://docs.rs/etherparse
etherparse = "0.21"
