[package]
name = "rnifler"
version = "1.1.0"
edition = "2021"
# Version minimale de Rust : `slice::as_chunks` (src/checksum.rs) date de Rust 1.88.
rust-version = "1.88"
description = "rnifler, le renifleur : sniffer MQTT 3.1.1 défensif en Rust (capture, réassemblage TCP, décodage)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/MkDriss/rnifler"
keywords = ["mqtt", "pcap", "sniffer", "security", "iot"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# Binding Rust de libpcap (le moteur de capture de tcpdump/Wireshark).
# Doc : https://docs.rs/pcap
pcap = "2"

# Lecture des options de la ligne de commande.
clap = { version = "4", features = ["derive"] }

# Découpage zéro-copie des en-têtes Ethernet / IP / TCP.
# Doc : https://docs.rs/etherparse
etherparse = "0.21"
